    <div style="max-width:560px;margin:30px auto;background:#ffffff;border:1px solid #d7e7dc;border-radius:14px;padding:30px;">
        <h2 style="margin:0 0 12px;color:#197d36;">
            DigiResult
        </h2>
        <p>Your Student Result Portal verification code is:</p>
        <div style="font-size:30px;font-weight:700;letter-spacing:8px;text-align:center;padding:18px;background:#eef9f1;border-radius:10px;margin:20px 0;">
